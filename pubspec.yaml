name: paysense
description: "PaySense - AI Powered Personal Finance App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Fonts
  google_fonts: ^6.3.1

  # Charts
  fl_chart: ^1.1.1

  # Animations
  flutter_animate: ^4.5.2

  # Permissions
  permission_handler: ^12.0.1

  # Date Formatting
  intl: ^0.20.2

  # UUID Generator
  uuid: ^4.5.1

  # HTTP client (PaySense AI backend proxy)
  http: ^1.2.2

  # Local storage (Hive)
  hive:
  hive_flutter:
  path_provider:
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  crypto: ^3.0.7
  local_auth: ^3.0.2

  # CSV bank statement import
  file_picker: ^12.1.0
  csv: ^6.0.0

  # Data export share sheet
  share_plus: ^13.3.0

  # PDF financial report generation (Milestone 6 — offline, no server round-trip)
  pdf: ^3.11.1

  # Cloud authentication (Milestone 1) — see FirebaseAuthService's class
  # doc: added for real, correct SDK integration code, but NOT active in
  # the running app yet (no real Firebase project exists — see
  # lib/firebase_options.dart).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: ^5.13.0
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  hive_generator:
  build_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/